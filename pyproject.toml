[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miwear"
version = "1.0.0"
description = "Decode and build the Xiaomi Mi Wear (mihealth) three-layer BLE protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "miwear contributors" }]
keywords = ["bluetooth", "ble", "xiaomi", "mi-band", "mi-watch", "reverse-engineering", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
# AES-CCM for legacy V1 payloads.
ccm = ["cryptography>=41"]
# Real-device BLE support (miwear.live).  Never a hard dependency: the core
# package stays pure standard library and `import miwear.live` works without it.
live = ["bleak>=0.20"]

[project.scripts]
miwear = "miwear.cli:main"
miwear-live = "miwear.live:main"
miwear-protogen = "miwear.protogen:main"

[tool.setuptools]
packages = ["miwear"]
