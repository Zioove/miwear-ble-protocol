[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miwear"
version = "1.0.0"
description = "Decode and build the Xiaomi Mi Wear (mihealth) three-layer BLE protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "miwear contributors" }]
keywords = ["bluetooth", "ble", "xiaomi", "mi-band", "mi-watch", "reverse-engineering", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
ccm = ["cryptography>=41"]

[project.scripts]
miwear = "miwear.cli:main"

[tool.setuptools]
packages = ["miwear"]
